# Base config: shared defaults. Experiment configs inherit via `_base_: base.yaml`
# and override only what they change. No magic numbers live in code (BRIEF §7).

seed: 42
deterministic: true          # deterministic cuDNN kernels; benches may override to false
device: cuda                 # falls back to cpu automatically if unavailable
amp: true                    # mixed precision (bf16/fp16) by default on transformers
amp_dtype: bf16              # bf16 preferred on Ada (RTX 4060); falls back to fp16
grad_checkpointing: true     # on by default for transformer training (8GB budget)

data:
  name: jester               # jester | nvgesture | shrec
  root: data/jester          # on-disk dataset root (see DATA_LICENSES.md to obtain)
  num_frames: 16             # default 16; allow 8 for the clip-length ablation
  frame_size: 172            # 172 or 224 px (resolution ablation)
  frame_sampling: segment    # uniform | random_uniform | segment (TSN-style)
  num_classes: 27            # Jester=27, NVGesture=25, SHREC=14/28
  num_workers: 4
  pin_memory: true

model:
  name: compact3dcnn         # registry key; overridden per experiment
  # model-specific kwargs go under `model.kwargs` in child configs

peft:
  method: none               # none | lora | adapter | prompt | full_ft
  lora_rank: 8
  lora_alpha: 16
  lora_targets: [q, k, v, o] # attention projections
  adapter_dim: 64
  prompt_tokens: 8

distill:
  enabled: false
  teacher_ckpt: null
  temperature: 4.0
  alpha_ce: 1.0              # L = a*CE + b*KD + g*feat
  beta_kd: 1.0
  gamma_feat: 0.0            # >0 enables feature distillation (ablation axis)

quant:
  mode: none                 # none | fp16 | int8_ptq | int8_qat
  prune_ratio: 0.0           # structured channel pruning ratio (0 disables)

train:
  epochs: 30
  batch_size: 8
  lr: 3.0e-4
  weight_decay: 0.05
  warmup_epochs: 2
  optimizer: adamw
  scheduler: cosine
  label_smoothing: 0.1
  grad_clip: 1.0
  log_every: 20
  eval_every: 1              # epochs

output:
  root: experiments
  group: default
  run_name: run              # override per experiment; artifacts land in root/group/
  checkpoint_dir: checkpoints

bench:
  warmup_iters: 20
  timed_iters: 100
  batch_sizes: [1, 8]        # single-clip latency (bs=1) + batched throughput
  flops_backend: fvcore      # primary; cross-checked with ptflops/thop
