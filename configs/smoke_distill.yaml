_base_: base.yaml
seed: 0
amp: true
amp_dtype: bf16
data:
  name: synthetic
  root: null
  num_frames: 8
  frame_size: 64
  num_classes: 6
  num_samples: 16
  num_workers: 0
model:
  name: streaming_student
  kwargs: {width: 16, blocks: [1, 1], expand: 4}
distill:
  enabled: true
  teacher_ckpt: checkpoints/smoke/smoke_peft_lora.pt
  temperature: 4.0
  alpha_ce: 1.0
  beta_kd: 1.0
  gamma_feat: 0.5
  feat_loss: mse
train: {epochs: 1, batch_size: 4, lr: 1.0e-3, warmup_epochs: 0, log_every: 2}
output: {group: smoke, run_name: smoke_distill}
bench: {warmup_iters: 3, timed_iters: 8, batch_sizes: [1, 4]}
